name: Publish birthday card

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Prepare the static website
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python -m pip install 'qrcode[pil]==8.2'
          mkdir -p _site
          cp index.html style.css app.js content.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
          python scripts/generate_qr.py --url "$PAGE_URL/" --output _site/qr
          python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
